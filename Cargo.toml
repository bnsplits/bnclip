[package]
name = "bnclip"
version = "0.1.0"
edition = "2021"

[dependencies]
blake3 = "1.8.7"
bytesize = { version = "2.7.0", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
hex = "0.4.3"
infer = "0.22"
percent-encoding = "2"
redb = "4.2.0"
redb-derive = "0.1.0"
regex = "1.11"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.5"

[profile.release]
lto = true
strip = true
codegen-units = 1
panic = "abort"
